<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840">
    <rect width="1200" height="840" fill="#F4F1E8"/><style>text{font-family:Arial,sans-serif;fill:#183A34}.small{font-size:17px;letter-spacing:2px}.title{font-family:Georgia,serif;font-size:42px}.label{font-size:25px;font-weight:bold}.body{font-size:22px}.note{font-size:19px;fill:#51685F}</style>
    <text x="55" y="48" class="small">ETERNITIES / RESEARCH PERSPECTIVE / 2026</text><text x="55" y="108" class="title">From a mechanism to a defensible claim.</text>
    <text x="55" y="810" class="small">CONCEPTUAL DIAGRAM / NOT MEASURED DATA</text><rect x="55" y="152" width="1090" height="87" rx="16" fill="#E1E9DC" stroke="#ACC5AF" stroke-width="2"/><text x="76" y="203" class="label">01</text><text x="137" y="186" class="label">Real consumer</text><text x="137" y="219" class="note">Does the proposed state reach an ordinary decision?</text><rect x="55" y="257" width="1090" height="87" rx="16" fill="#FFFFFF" stroke="#ACC5AF" stroke-width="2"/><text x="76" y="308" class="label">02</text><text x="137" y="291" class="label">Consequence closure</text><text x="137" y="324" class="note">Did an independently observed outcome enter the next choice?</text><rect x="55" y="362" width="1090" height="87" rx="16" fill="#E1E9DC" stroke="#ACC5AF" stroke-width="2"/><text x="76" y="413" class="label">03</text><text x="137" y="396" class="label">Selective causality</text><text x="137" y="429" class="note">Do lesion, sham, restoration, and a strong rival separate explanations?</text><rect x="55" y="467" width="1090" height="87" rx="16" fill="#FFFFFF" stroke="#ACC5AF" stroke-width="2"/><text x="76" y="518" class="label">04</text><text x="137" y="501" class="label">Generalization</text><text x="137" y="534" class="note">Does the result survive fresh conditions, reversal, and restart?</text><rect x="55" y="572" width="1090" height="87" rx="16" fill="#E1E9DC" stroke="#ACC5AF" stroke-width="2"/><text x="76" y="623" class="label">05</text><text x="137" y="606" class="label">Theory comparison</text><text x="137" y="639" class="note">Which competing accounts predict the observed pattern?</text><path d="M70,697 L1130,697" fill="none" stroke="#AD6745" stroke-width="3" stroke-dasharray="8 7" /><text x="55" y="735" class="label">SUBJECTIVE EXPERIENCE / the inference remains contested.</text><text x="55" y="774" class="note">Ethical recognition is a separate judgment, with explicit uncertainty and duties.</text></svg>