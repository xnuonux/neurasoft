<svg xmlns="http://www.w3.org/2000/svg" width="800" height="748" viewBox="0 0 800 748" role="img" aria-labelledby="title desc">
<title id="title">One reach, three different borders</title><desc id="desc">A single hand-and-rake action is shown with separate visual cues for the physical skin, multisensory nearby space, and tool-linked reachable space. These are conceptual distinctions, not measured boundaries.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f5eb"/><stop offset="1" stop-color="#eaf0e7"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#bed6c3" stop-opacity=".74"/><stop offset="1" stop-color="#bed6c3" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#769b81" opacity=".26"/></pattern>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#203b34}.serif{font-family:Georgia,serif}.eyebrow{font-size:19px;letter-spacing:4px;fill:#54775f}.small{font-size:18px}.label{font-size:21px;font-weight:700}.muted{fill:#597268}</style>
</defs><rect width="800" height="748" fill="url(#paper)"/>
<text class="eyebrow" x="48" y="52">NEURASOFT / EXPLAINER 01</text>
<text class="serif" x="48" y="110" font-size="43">One reach. Three different borders.</text>
<text class="muted" x="49" y="147" font-size="20">A single action can be described three ways.</text>
