<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">A compass in the root tip</title><desc id="desc">Four conceptual stages from tilting to statolith settling, uneven auxin, and downward root curvature.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f7f4ea"/><stop offset="1" stop-color="#e8eee3"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78936e" stroke-width="1.6"/></marker></defs>
<rect width="1000" height="760" fill="url(#bg)"/><text x="52" y="66" fill="#244738" font-family="Georgia,serif" font-size="45">A compass in the root tip</text><text x="52" y="105" fill="#617766" font-family="Arial,sans-serif" font-size="20">How orientation becomes a curve — a conceptual primary-root sequence</text>
<g fill="#fffdf8" stroke="#c6d3c3" stroke-width="2"><rect x="52" y="145" width="420" height="245" rx="22"/><rect x="528" y="145" width="420" height="245" rx="22"/><rect x="52" y="420" width="420" height="245" rx="22"/><rect x="528" y="420" width="420" height="245" rx="22"/></g>
<g font-family="Arial,sans-serif"><g fill="#537357" font-size="17" font-weight="bold" letter-spacing="2"><text x="78" y="180">01  TILT</text><text x="554" y="180">02  SENSE</text><text x="78" y="455">03  TRANSPORT</text><text x="554" y="455">04  GROW</text></g><g fill="#233f34" font-size="23"><text x="78" y="220">The root changes angle.</text><text x="554" y="220">Dense statoliths settle.</text><text x="78" y="495">Auxin shifts unevenly.</text><text x="554" y="495">One side lengthens more.</text></g></g>
<path d="M192 258L300 339" stroke="#65965f" stroke-width="24" stroke-linecap="round"/><ellipse cx="309" cy="344" rx="24" ry="17" transform="rotate(34 309 344)" fill="#b4d49a" stroke="#6e9b67" stroke-width="3"/><path d="M359 267V345" stroke="#8da781" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="325" y="252" fill="#60805c" font-family="Arial" font-size="15">down</text>
<rect x="669" y="248" width="130" height="105" rx="26" fill="#e9f0e4" stroke="#8aab86" stroke-width="3" transform="rotate(22 734 300)"/><g fill="#b88a61"><circle cx="734" cy="309" r="10"/><circle cx="754" cy="318" r="9"/><circle cx="716" cy="326" r="9"/></g><path d="M824 248V343" stroke="#8da781" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="557" y="374" fill="#627b65" font-family="Arial" font-size="17">Root-cap sensing cells</text>
<path d="M212 533V621M287 533V621" stroke="#aec7a4" stroke-width="30" stroke-linecap="round"/><path d="M212 533V621" stroke="#6e9f65" stroke-width="12" stroke-linecap="round" opacity=".8"/><path d="M287 533V621" stroke="#d5966b" stroke-width="21" stroke-linecap="round" opacity=".8"/><text x="137" y="647" fill="#557b56" font-family="Arial" font-size="18">less auxin</text><text x="284" y="647" fill="#a36b4d" font-family="Arial" font-size="18">more auxin</text>
<path d="M704 536C724 566 717 603 680 639" fill="none" stroke="#76a16c" stroke-width="29" stroke-linecap="round"/><path d="M738 537C741 565 741 589 713 621" fill="none" stroke="#d6a377" stroke-width="14" stroke-linecap="round"/><text x="783" y="566" fill="#6c8b62" font-family="Arial" font-size="17">upper side</text><text x="783" y="593" fill="#6c8b62" font-family="Arial" font-size="17">extends faster</text><path d="M478 267H518M478 542H518" stroke="#8fa88c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="52" y="713" fill="#526b59" font-family="Arial,sans-serif" font-size="17">Simplified mechanism • not a microscopic image • organ and species details vary</text>
