<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">More than one compass</title><desc id="desc">A conceptual soil cross-section shows a downward primary root, angled lateral branches, and a root bending toward a wetter patch.</desc>
<defs><linearGradient id="soil" x2="0" y2="1"><stop stop-color="#e9e3d2"/><stop offset="1" stop-color="#d2d9c9"/></linearGradient><radialGradient id="wet"><stop stop-color="#acc8c3" stop-opacity=".9"/><stop offset="1" stop-color="#acc8c3" stop-opacity="0"/></radialGradient><marker id="down" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#78936e" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="680" fill="#f6f3eb"/><text x="52" y="64" fill="#244738" font-family="Georgia,serif" font-size="45">More than one compass</text><text x="52" y="104" fill="#617766" font-family="Arial,sans-serif" font-size="20">Real roots grow among several cues, not one painted arrow.</text><path d="M0 223C277 201 524 236 1000 213V680H0Z" fill="url(#soil)"/><path d="M0 223C277 201 524 236 1000 213" fill="none" stroke="#779277" stroke-width="4"/><ellipse cx="760" cy="461" rx="186" ry="154" fill="url(#wet)"/><g fill="#769a9a" opacity=".65"><circle cx="744" cy="390" r="7"/><circle cx="807" cy="428" r="6"/><circle cx="697" cy="476" r="8"/><circle cx="849" cy="506" r="7"/><circle cx="767" cy="548" r="6"/></g>
<path d="M453 251C454 312 453 360 463 402C467 454 476 500 475 602" fill="none" stroke="#f8f3e6" stroke-width="24" stroke-linecap="round"/><path d="M460 383C401 393 338 432 295 498" fill="none" stroke="#f8f3e6" stroke-width="15" stroke-linecap="round"/><path d="M470 452C531 450 559 475 597 488C643 505 680 499 716 465" fill="none" stroke="#f8f3e6" stroke-width="16" stroke-linecap="round"/><path d="M473 541C419 551 391 574 361 614" fill="none" stroke="#f8f3e6" stroke-width="10" stroke-linecap="round"/><ellipse cx="454" cy="232" rx="37" ry="23" transform="rotate(-19 454 232)" fill="#b98864" stroke="#916a51" stroke-width="3"/><path d="M451 213C438 171 436 158 450 140" fill="none" stroke="#5e8d5a" stroke-width="9" stroke-linecap="round"/><path d="M449 171C424 149 407 151 390 157C407 176 424 180 449 171Z" fill="#7ba46c"/><path d="M448 152C469 132 488 129 503 136C489 155 473 163 448 152Z" fill="#82a96c"/>
<path d="M146 301V396" fill="none" stroke="#507756" stroke-width="4" marker-end="url(#down)"/><text x="76" y="275" fill="#3d6547" font-family="Arial,sans-serif" font-size="22">gravity</text><path d="M301 450C330 425 355 407 388 393" fill="none" stroke="#956d4e" stroke-width="2" stroke-dasharray="5 5"/><rect x="81" y="449" width="192" height="72" rx="11" fill="#fffdf6" stroke="#b9c8b3"/><text x="101" y="480" fill="#35563e" font-family="Arial,sans-serif" font-size="20">lateral branch</text><text x="101" y="505" fill="#6b806b" font-family="Arial,sans-serif" font-size="16">holds an angle</text>
<path d="M715 466C786 462 817 425 838 385" fill="none" stroke="#6b9295" stroke-width="2" stroke-dasharray="5 5"/><rect x="756" y="297" width="184" height="74" rx="11" fill="#fffdf6" stroke="#a5c0bd"/><text x="776" y="329" fill="#466f74" font-family="Arial,sans-serif" font-size="20">wetter patch</text><text x="776" y="354" fill="#718c8c" font-family="Arial,sans-serif" font-size="16">a different cue</text>
<text x="52" y="646" fill="#526b59" font-family="Arial,sans-serif" font-size="17">Conceptual map • proportions and paths are illustrative, not measurements</text>
</svg>
