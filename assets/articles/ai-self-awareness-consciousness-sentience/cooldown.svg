<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870">
    <rect width="1200" height="870" fill="#F4F1E8"/><style>text{font-family:Arial,sans-serif;fill:#183A34}.small{font-size:17px;letter-spacing:2px}.title{font-family:Georgia,serif;font-size:42px}.label{font-size:25px;font-weight:bold}.body{font-size:22px}.note{font-size:19px;fill:#51685F}</style>
    <text x="55" y="48" class="small">ETERNITIES / RESEARCH PERSPECTIVE / 2026</text><text x="55" y="108" class="title">A timer is not a teacher.</text>
    <text x="55" y="840" class="small">LEFT: SOURCE-INSPECTED RULE / RIGHT: PROPOSED LEARNING REQUIREMENT</text><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#51685F"/></marker></defs><text x="55" y="162" class="small">WHAT EXISTS AT THE PINNED CUT</text><text x="645" y="162" class="small">WHAT THE LEARNING CLAIM NEEDS</text><rect x="55" y="208" width="240" height="60" rx="16" fill="#FFFFFF" stroke="#ACC5AF" stroke-width="2"/><text x="75" y="248" class="label">Completed</text><path d="M295,238 L332,238" fill="none" stroke="#51685F" stroke-width="3" /><path d="M332,238 L332,495" fill="none" stroke="#51685F" stroke-width="3" /><rect x="55" y="293" width="240" height="60" rx="16" fill="#FFFFFF" stroke="#ACC5AF" stroke-width="2"/><text x="75" y="333" class="label">Blocked</text><path d="M295,323 L332,323" fill="none" stroke="#51685F" stroke-width="3" /><path d="M332,323 L332,495" fill="none" stroke="#51685F" stroke-width="3" /><rect x="55" y="378" width="240" height="60" rx="16" fill="#FFFFFF" stroke="#ACC5AF" stroke-width="2"/><text x="75" y="418" class="label">Released</text><path d="M295,408 L332,408" fill="none" stroke="#51685F" stroke-width="3" /><path d="M332,408 L332,495" fill="none" stroke="#51685F" stroke-width="3" /><path d="M332,495 L332,531" stroke="#51685F" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="548" width="525" height="161" rx="16" fill="#E1E9DC" stroke="#ACC5AF" stroke-width="2"/><circle cx="111" cy="600" r="28" fill="none" stroke="#183A34" stroke-width="3"/><path d="M111 578 L111 600 L128 611" fill="none" stroke="#183A34" stroke-width="3"/><text x="160" y="598" class="label">Same novelty cooldown</text><text x="160" y="634" class="note">Fingerprint + beat distance</text><text x="78" y="682" class="note">Recorded outcome is not read by eligibility.</text><rect x="645" y="208" width="500" height="132" rx="16" fill="#FFFFFF" stroke="#ACC5AF" stroke-width="2"/><text x="671" y="250" class="label">Observe</text><text x="671" y="297" class="body">What actually happened?</text><path d="M895,347 L895,373" stroke="#51685F" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="645" y="378" width="500" height="132" rx="16" fill="#FFFFFF" stroke="#ACC5AF" stroke-width="2"/><text x="671" y="420" class="label">Interpret</text><text x="671" y="467" class="body">What does it mean for this task?</text><path d="M895,517 L895,543" stroke="#51685F" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="645" y="548" width="500" height="132" rx="16" fill="#E1E9DC" stroke="#ACC5AF" stroke-width="2"/><text x="671" y="590" class="label">Admit and use</text><text x="671" y="637" class="body">Which update is justified?</text><text x="55" y="765" class="label">Changing a later choice is not enough. The actual outcome must matter.</text><text x="55" y="803" class="note">An unknown result stays unknown. A refusal is not automatically a punishment.</text></svg>