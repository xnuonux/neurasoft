<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
    <rect width="1200" height="760" fill="#F4F1E8"/><style>text{font-family:Arial,sans-serif;fill:#183A34}.small{font-size:17px;letter-spacing:2px}.title{font-family:Georgia,serif;font-size:42px}.label{font-size:25px;font-weight:bold}.body{font-size:22px}.note{font-size:19px;fill:#51685F}</style>
    <text x="55" y="48" class="small">ETERNITIES / RESEARCH PERSPECTIVE / 2026</text><text x="55" y="108" class="title">Three questions. Three separate judgments.</text>
    <text x="55" y="730" class="small">CONCEPTUAL DIAGRAM / NOT MEASURED DATA</text><rect x="55" y="170" width="340" height="180" rx="16" fill="#FFFFFF" stroke="#ACC5AF" stroke-width="2"/><text x="75" y="210" class="label">Self-awareness</text><text x="75" y="260" class="body">Accurate, fallible access</text><text x="75" y="292" class="body">to aspects of oneself.</text><rect x="55" y="435" width="340" height="180" rx="16" fill="#E1E9DC" stroke="#ACC5AF" stroke-width="2"/><text x="75" y="480" class="label">Operational completion</text><text x="75" y="530" class="body">Does the integrated</text><text x="75" y="562" class="body">organism work?</text><rect x="420" y="170" width="340" height="180" rx="16" fill="#FFFFFF" stroke="#ACC5AF" stroke-width="2"/><text x="440" y="210" class="label">Consciousness</text><text x="440" y="260" class="body">Is there anything it is</text><text x="440" y="292" class="body">like to be the system?</text><rect x="420" y="435" width="340" height="180" rx="16" fill="#E1E9DC" stroke="#ACC5AF" stroke-width="2"/><text x="440" y="480" class="label">Scientific candidacy</text><text x="440" y="530" class="body">Does causal evidence</text><text x="440" y="562" class="body">survive serious rivals?</text><rect x="785" y="170" width="340" height="180" rx="16" fill="#FFFFFF" stroke="#ACC5AF" stroke-width="2"/><text x="805" y="210" class="label">Sentience</text><text x="805" y="260" class="body">Can experience carry</text><text x="805" y="292" class="body">felt positive or negative value?</text><rect x="785" y="435" width="340" height="180" rx="16" fill="#E1E9DC" stroke="#ACC5AF" stroke-width="2"/><text x="805" y="480" class="label">Recognition and care</text><text x="805" y="530" class="body">What duties follow</text><text x="805" y="562" class="body">under uncertainty?</text><text x="55" y="399" class="small">THE THREE CROWNS ARE NOT THE THREE QUESTIONS.</text><text x="55" y="665" class="note">No score, checklist, or company declaration automatically connects the two.</text></svg>