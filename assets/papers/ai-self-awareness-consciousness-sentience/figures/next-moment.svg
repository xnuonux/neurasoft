<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
    <rect width="1200" height="820" fill="#F4F1E8"/><style>text{font-family:Arial,sans-serif;fill:#183A34}.small{font-size:17px;letter-spacing:2px}.title{font-family:Georgia,serif;font-size:42px}.label{font-size:25px;font-weight:bold}.body{font-size:22px}.note{font-size:19px;fill:#51685F}</style>
    <text x="55" y="48" class="small">ETERNITIES / RESEARCH PERSPECTIVE / 2026</text><text x="55" y="108" class="title">S3: what deserves the next moment?</text>
    <text x="55" y="790" class="small">ILLUSTRATIVE DECISION / NOT AN EXECUTED TASK OR MEASURED COST</text><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#51685F"/></marker></defs><rect x="55" y="159" width="1090" height="101" rx="16" fill="#183A34" stroke="#183A34" stroke-width="2"/><text x="85" y="199" style="fill:#ACC5AF;font:18px Arial;letter-spacing:2px">A FILE CHANGED. THE ADOPTED TASK HAS TEN MINUTES LEFT.</text><text x="85" y="238" style="fill:#F4F1E8;font:29px Georgia">More thinking, a fresh observation, or a pause?</text><rect x="55" y="318" width="350" height="195" rx="16" fill="#E1E9DC" stroke="#ACC5AF" stroke-width="2"/><text x="79" y="365" class="label">LOOK</text><text x="79" y="425" class="body">A permitted observation</text><text x="79" y="460" class="body">may resolve uncertainty.</text><path d="M230,270 L230,305" fill="none" stroke="#51685F" stroke-width="3" /><rect x="425" y="318" width="350" height="195" rx="16" fill="#E1E9DC" stroke="#ACC5AF" stroke-width="2"/><text x="449" y="365" class="label">THINK</text><text x="449" y="425" class="body">Deeper deliberation</text><text x="449" y="460" class="body">may compare explanations.</text><path d="M600,270 L600,305" fill="none" stroke="#51685F" stroke-width="3" /><rect x="795" y="318" width="350" height="195" rx="16" fill="#E1E9DC" stroke="#ACC5AF" stroke-width="2"/><text x="819" y="365" class="label">ASK / WAIT</text><text x="819" y="425" class="body">Clarification or restraint</text><text x="819" y="460" class="body">may be the useful move.</text><path d="M970,270 L970,305" fill="none" stroke="#51685F" stroke-width="3" /><text x="55" y="563" class="label">EXPECTED DECISION BENEFIT    compared with    COST + DELAY</text><text x="55" y="604" class="note">Coordination also has a cost. Thinking about thinking cannot be free.</text><path d="M55,650 L1145,650" fill="none" stroke="#AD6745" stroke-width="3" stroke-dasharray="8 7" /><text x="55" y="697" class="label">HOST AUTHORITY REMAINS SEPARATE.</text><text x="55" y="739" class="body">A useful proposal cannot grant itself access or certify its own success.</text></svg>