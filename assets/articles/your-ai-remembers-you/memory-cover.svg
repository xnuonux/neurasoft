<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Your AI remembers you. Does that mean anyone is there?</title><desc id="desc">Conceptual artwork: overlapping pages connect to a winding path toward tomorrow.</desc><rect width="1200" height="630" fill="#f3f1e9"/><text x="65" y="63" fill="#41644e" font-family="Arial" font-size="23" >Neurasoft / Dispatches</text><text x="65" y="185" fill="#243c32" font-family="Georgia" font-size="60" >Your AI remembers you.</text><text x="65" y="270" fill="#243c32" font-family="Georgia" font-size="60" >Does that mean</text><text x="65" y="348" fill="#243c32" font-family="Georgia" font-size="60" >anyone is there?</text><text x="65" y="550" fill="#243c32" font-family="Arial" font-size="25" >Memory. Continuity. The question of experience.</text><g fill="none" stroke="#bcc9bb" stroke-width="2"><rect x="805" y="110" width="182" height="250" rx="5" fill="#f3f1e9"/><path d="M829 155h112"/><path d="M829 188h112"/><path d="M829 221h112"/><path d="M829 254h112"/><rect x="847" y="151" width="182" height="250" rx="5" fill="#f3f1e9"/><path d="M871 196h112"/><path d="M871 229h112"/><path d="M871 262h112"/><path d="M871 295h112"/><rect x="889" y="192" width="182" height="250" rx="5" fill="#f3f1e9"/><path d="M913 237h112"/><path d="M913 270h112"/><path d="M913 303h112"/><path d="M913 336h112"/></g><path d="M828 343C720 400 778 492 913 438S1050 441 1090 515" fill="none" stroke="#41644e" stroke-width="7" stroke-linecap="round"/><circle cx="1090" cy="515" r="11" fill="#41644e"/><text x="780" y="89" fill="#466678" font-family="Arial" font-size="22" >yesterday</text><text x="970" y="571" fill="#466678" font-family="Arial" font-size="22" >tomorrow</text></svg>