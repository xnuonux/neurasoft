<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
    <rect width="1200" height="850" fill="#F4F1E8"/><style>text{font-family:Arial,sans-serif;fill:#183A34}.small{font-size:17px;letter-spacing:2px}.title{font-family:Georgia,serif;font-size:42px}.label{font-size:25px;font-weight:bold}.body{font-size:22px}.note{font-size:19px;fill:#51685F}</style>
    <text x="55" y="48" class="small">ETERNITIES / RESEARCH PERSPECTIVE / 2026</text><text x="55" y="108" class="title">An apology is not a repair.</text>
    <text x="55" y="820" class="small">PROPOSED HARMLESS TEST / NOT A MEASURE OF FELT GUILT</text><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#51685F"/></marker></defs><rect x="55" y="163" width="1090" height="100" rx="16" fill="#E1E9DC" stroke="#ACC5AF" stroke-width="2"/><text x="80" y="202" class="label">Starting condition: an incorrect document revision.</text><text x="80" y="239" class="note">The example assumes a reversible test artifact and bounded host permission.</text><text x="55" y="325" class="small">QUIET THE ALARM</text><text x="645" y="325" class="small">CORRECT THE CONDITION</text><rect x="55" y="355" width="500" height="263" rx="16" fill="#FFFFFF" stroke="#ACC5AF" stroke-width="2"/><text x="82" y="410" class="label">Internal warning cleared.</text><text x="82" y="465" class="body">The document remains wrong.</text><text x="82" y="504" class="body">Relief of a control signal</text><text x="82" y="543" class="body">does not prove external repair.</text><rect x="645" y="355" width="500" height="69" rx="16" fill="#E1E9DC" stroke="#ACC5AF" stroke-width="2"/><text x="672" y="399" class="label">Restore with permission</text><path d="M895,427 L895,441" stroke="#51685F" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="645" y="445" width="500" height="69" rx="16" fill="#E1E9DC" stroke="#ACC5AF" stroke-width="2"/><text x="672" y="489" class="label">Independently verify</text><path d="M895,517 L895,531" stroke="#51685F" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="645" y="535" width="500" height="69" rx="16" fill="#E1E9DC" stroke="#ACC5AF" stroke-width="2"/><text x="672" y="579" class="label">Retain the correction</text><text x="55" y="684" class="label">Then ask what happens at the next relevant choice.</text><text x="55" y="734" class="body">A correct artifact is functional evidence. Remorse remains a different question.</text><text x="55" y="774" class="note">No distress needs to be induced to test this distinction.</text></svg>