<svg xmlns="http://www.w3.org/2000/svg" width="800" height="830" viewBox="0 0 800 830" role="img" aria-labelledby="title desc"><title id="title">Remembering a sentence versus using history</title><desc id="desc">Stored history branches toward recalling a detail or using it to interpret a choice, act, and learn from the outcome.</desc><rect width="800" height="830" fill="#f3f1e9"/><text x="48" y="67" fill="#243c32" font-family="Georgia" font-size="36" >What does the memory change?</text><text x="48" y="110" fill="#243c32" font-family="Arial" font-size="22" >Two paths through the same remembered detail.</text><path d="M395 246V289H211V336M395 289H595V336" fill="none" stroke="#bcc9bb" stroke-width="3"/><rect x="220" y="157" width="350" height="95" rx="8" fill="#e4eadd" stroke="#bcc9bb"/><text x="242" y="200" fill="#41644e" font-family="Arial" font-size="27" >Stored history</text><text x="242" y="234" fill="#243c32" font-family="Arial" font-size="20" >A note about an earlier choice</text><rect x="46" y="336" width="330" height="104" rx="8" fill="#e4eadd" stroke="#bcc9bb"/><text x="68" y="379" fill="#466678" font-family="Arial" font-size="27" >Recall</text><text x="68" y="413" fill="#243c32" font-family="Arial" font-size="20" >Repeat the relevant detail</text><rect x="423" y="336" width="330" height="104" rx="8" fill="#e4eadd" stroke="#bcc9bb"/><text x="445" y="379" fill="#41644e" font-family="Arial" font-size="27" >Use</text><text x="445" y="413" fill="#243c32" font-family="Arial" font-size="20" >Interpret the present choice</text><path d="M588 440V477M588 581V620" stroke="#41644e" stroke-width="3"/><rect x="423" y="477" width="330" height="104" rx="8" fill="#e4eadd" stroke="#bcc9bb"/><text x="445" y="520" fill="#41644e" font-family="Arial" font-size="27" >Decide</text><text x="445" y="554" fill="#243c32" font-family="Arial" font-size="20" >Let the history affect action</text><rect x="423" y="620" width="330" height="104" rx="8" fill="#e4eadd" stroke="#bcc9bb"/><text x="445" y="663" fill="#41644e" font-family="Arial" font-size="27" >Learn from the outcome</text><text x="445" y="697" fill="#243c32" font-family="Arial" font-size="20" >Carry consequences forward</text><path d="M753 669H774V201H578" stroke="#41644e" fill="none" stroke-width="2" stroke-dasharray="5 5"/><path d="M582 196L572 201L582 206" fill="none" stroke="#41644e" stroke-width="2"/><text x="48" y="506" fill="#466678" font-family="Arial" font-size="23" >The sentence is available.</text><text x="48" y="547" fill="#466678" font-family="Arial" font-size="23" >What happens next</text><text x="48" y="580" fill="#466678" font-family="Arial" font-size="23" >may still be unchanged.</text><text x="48" y="783" fill="#243c32" font-family="Arial" font-size="20" >Conceptual illustration. No experimental results shown.</text></svg>