<svg xmlns="http://www.w3.org/2000/svg" width="800" height="860" viewBox="0 0 800 860" role="img" aria-labelledby="title desc"><title id="title">Four distinct questions about an AI system</title><desc id="desc">Capability, continuity, responsibility, and subjective experience require different evidence. Progress in one does not automatically establish another.</desc><rect width="800" height="860" fill="#f3f1e9"/><text x="48" y="70" fill="#243c32" font-family="Georgia" font-size="34" >Four questions. Four kinds of evidence.</text><line x1="48" y1="126" x2="752" y2="126" stroke="#bcc9bb"/><text x="48" y="167" fill="#466678" font-family="Arial" font-size="22" >Capability</text><text x="48" y="209" fill="#243c32" font-family="Georgia" font-size="31" >What can it do?</text><text x="48" y="247" fill="#243c32" font-family="Arial" font-size="21" >Look at results on the task.</text><line x1="48" y1="285" x2="752" y2="285" stroke="#bcc9bb"/><text x="48" y="326" fill="#466678" font-family="Arial" font-size="22" >Continuity</text><text x="48" y="368" fill="#243c32" font-family="Georgia" font-size="31" >What carries forward?</text><text x="48" y="406" fill="#243c32" font-family="Arial" font-size="21" >Test the influence of earlier state.</text><line x1="48" y1="444" x2="752" y2="444" stroke="#bcc9bb"/><text x="48" y="485" fill="#466678" font-family="Arial" font-size="22" >Responsibility</text><text x="48" y="527" fill="#243c32" font-family="Georgia" font-size="31" >How does it handle consequences?</text><text x="48" y="565" fill="#243c32" font-family="Arial" font-size="21" >Examine choices, limits, and repair.</text><line x1="48" y1="603" x2="752" y2="603" stroke="#bcc9bb"/><text x="48" y="644" fill="#466678" font-family="Arial" font-size="22" >Experience</text><text x="48" y="686" fill="#243c32" font-family="Georgia" font-size="31" >Is there a subjective point of view?</text><text x="48" y="724" fill="#243c32" font-family="Arial" font-size="21" >An open scientific and philosophical question.</text><text x="48" y="815" fill="#243c32" font-family="Arial" font-size="21" >These are lenses, not a ladder or a consciousness score.</text></svg>