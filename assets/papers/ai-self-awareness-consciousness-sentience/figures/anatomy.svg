    <text x="55" y="850" class="small">CONCEPTUAL DIAGRAM / NOT MEASURED DATA</text><rect x="55" y="155" width="1090" height="430" rx="16" fill="#E1E9DC" stroke="#ACC5AF" stroke-width="2"/><text x="80" y="190" class="small">PROPOSED RESIDENT / RECIPROCAL INTERNAL INFLUENCE</text><rect x="85" y="220" width="305" height="132" rx="16" fill="#FFFFFF" stroke="#ACC5AF" stroke-width="2"/><text x="103" y="253" class="label">S1 / Reflex</text><text x="103" y="293" class="note">Bounded discrimination</text><text x="103" y="321" class="note">Fast salience and choice</text><rect x="445" y="220" width="305" height="132" rx="16" fill="#FFFFFF" stroke="#ACC5AF" stroke-width="2"/><text x="463" y="253" class="label">S3 / Coordination</text><text x="463" y="293" class="note">Attention, effort, uncertainty</text><text x="463" y="321" class="note">Continuation and stopping</text><rect x="805" y="220" width="305" height="132" rx="16" fill="#FFFFFF" stroke="#ACC5AF" stroke-width="2"/><text x="823" y="253" class="label">S2 / Deliberation</text><text x="823" y="293" class="note">Language and reasoning</text><text x="823" y="321" class="note">Planning and imagination</text><path d="M390,283 L445,283" fill="none" stroke="#51685F" stroke-width="3" /><path d="M750,283 L805,283" fill="none" stroke="#51685F" stroke-width="3" /><rect x="85" y="413" width="1025" height="132" rx="16" fill="#F4F1E8" stroke="#ACC5AF" stroke-width="2"/><text x="112" y="450" class="label">Persistent internal organization</text><text x="112" y="492" class="body">Memory · modulation · appraisal · unfinished intentions · learning</text><path d="M237,352 L237,410" fill="none" stroke="#51685F" stroke-width="3" /><path d="M597,352 L597,410" fill="none" stroke="#51685F" stroke-width="3" /><path d="M957,352 L957,410" fill="none" stroke="#51685F" stroke-width="3" /><path d="M600,585 L600,625" fill="none" stroke="#51685F" stroke-width="3" /><rect x="55" y="627" width="1090" height="82" rx="16" fill="#183A34" stroke="#183A34" stroke-width="2"/><text x="80" y="661" style="fill:white;font: bold 24px Arial">HOST AUTHORITY / permission, execution custody, independent observation</text><text x="80" y="693" style="fill:#ACC5AF;font:20px Arial">An action proposal cannot create its own permission or certify its own success.</text><path d="M600,709 L600,735" fill="none" stroke="#51685F" stroke-width="3" /><rect x="55" y="737" width="1090" height="65" rx="16" fill="#FFFFFF" stroke="#ACC5AF" stroke-width="2"/><text x="80" y="780" class="body">HABITAT / bounded workspace, applications, and observable consequences</text></svg>